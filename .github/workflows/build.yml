name: Build PulseOS Gaming ROM (with Play Market)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y aria2 xz-utils zip

    - name: Download & Extract GSI
      run: |
        echo "=== СКАЧИВАНИЕ И РАСПАКОВКА PULSEOS ==="
        aria2c -x16 -s16 -k1M "https://github.com"
        xz -d system-*.img.xz
        mv system-*.img PulseOS-Android11-Pine.img

    - name: Fast Zip Package
      run: |
        echo "=== БЫСТРОЕ СЖАТИЕ В ZIP ==="
        zip -r PulseOS-With-PlayMarket.zip PulseOS-Android11-Pine.img

    - name: Upload Finished Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PulseOS-With-PlayMarket
        path: PulseOS-With-PlayMarket.zip
