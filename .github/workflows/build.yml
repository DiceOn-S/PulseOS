name: Build PulseOS Gaming ROM (with Play Market)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Install Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y aria2 xz-utils

    - name: Download & Rename Base GSI
      run: |
        echo "=== СКАЧИВАНИЕ И ПОДГОТОВКА PULSEOS ==="
        # Скачиваем стабильный Android 11 AOSP со встроенным Play Маркетом
        aria2c -x16 -s16 -k1M "https://github.com"
        
        echo "=== РАСПАКОВКА ОБРАЗА СИСТЕМЫ ==="
        xz -d system-*.img.xz
        
        echo "=== ПЕРЕИМЕНОВАНИЕ В PULSEOS ==="
        mv system-*.img PulseOS-Android11-Pine.img

    - name: Package Firmware
      run: |
        echo "=== УПАКОВКА В ИГРОВОЙ АРХИВ ==="
        tar -cvzf PulseOS-Pine-PlayMarket.tar.gz PulseOS-Android11-Pine.img

    - name: Upload Finished Firmware
      uses: actions/upload-artifact@v3
      with:
        name: PulseOS-With-PlayMarket
        path: PulseOS-Pine-PlayMarket.tar.gz
